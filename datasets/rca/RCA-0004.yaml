id: RCA-0004

title: Unexpected Equipment Shutdown Due to Sensor Failure

category: RCA

tags:
  - sensor
  - shutdown
  - equipment
  - fault

problem:
  Equipment stopped unexpectedly during operation.

observation:
  - Equipment shutdown alarm activated.
  - Sensor signal remained fixed despite changing conditions.
  - No mechanical abnormalities detected.

hypothesis:
  Faulty sensor provided incorrect process feedback.

action:
  Sensor functionality verified and replaced.

result:
  Equipment resumed normal operation after sensor replacement.

root_cause:
  Failed sensor generated invalid feedback, triggering protective shutdown logic.

solution:
  Replace faulty sensor and verify calibration settings.

lesson:
  Verify sensor health before investigating complex mechanical failures.

confidence: 90

